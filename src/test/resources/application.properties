# Test configuration: in-memory H2 database, so tests need neither MySQL nor internet.
# The credentials below are test-only fixtures, not real secrets.
spring.datasource.url=jdbc:h2:mem:cadastro_pessoas;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
app.security.username=admin
app.security.password=test-only-password
# Unreachable on purpose: tests must never call the real nationalize.io API
app.nationalize.url=http://localhost:0
