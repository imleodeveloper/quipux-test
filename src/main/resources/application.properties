spring.application.name=cadastro-pessoas

# Secrets live in the ".env" file at the project root (not committed). See ".env.example".
spring.config.import=optional:file:.env[.properties]

# Default database: MySQL. To run without MySQL use the "h2" profile:
#   -Dspring-boot.run.profiles=h2
# The database is created automatically if it does not exist.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cadastro_pessoas}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Creates/updates the tables from the JPA entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Web login credentials. There is no default password on purpose: APP_PASSWORD must be set in ".env".
app.security.username=${APP_USER:admin}
app.security.password=${APP_PASSWORD}

# Public API used to predict a nationality from a first name
app.nationalize.url=https://api.nationalize.io

# Session cookie: not readable by JavaScript and not sent on cross-site requests
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
